version: '3.9'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: education-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: education_db
      MYSQL_USER: education_user
      MYSQL_PASSWORD: education_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - education-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: education-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/education_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: education_user
      SPRING_DATASOURCE_PASSWORD: education_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: mysql
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_EDUCATION: DEBUG
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - education-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./front2
      dockerfile: Dockerfile
    container_name: education-frontend
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_API_BASE_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - education-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # phpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: education-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: education_user
      PMA_PASSWORD: education_password
      PMA_ROOT_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - education-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  education-network:
    driver: bridge
