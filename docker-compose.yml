services:

  # =========================
  # MySQL Database
  # =========================
  mysql:
    image: mysql:8.0
    container_name: education-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: education_db
      MYSQL_USER: education_user
      MYSQL_PASSWORD: education_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - education-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # =========================
  # Backend API
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: education-backend

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/education_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: education_user
      SPRING_DATASOURCE_PASSWORD: education_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: mysql

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_EDUCATION: DEBUG

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./backend/uploads:/app/uploads

    networks:
      - education-network

    restart: unless-stopped


  # =========================
  # Frontend Application
  # =========================
  frontend:
    build:
      context: ./front2
      dockerfile: Dockerfile

    container_name: education-frontend

    environment:
      VITE_API_URL: "http://localhost:8081"
      VITE_API_BASE_URL: "/api"

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - education-network

    restart: unless-stopped


  # =========================
  # phpMyAdmin
  # =========================
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: education-phpmyadmin

    environment:
      PMA_HOST: mysql
      PMA_USER: education_user
      PMA_PASSWORD: education_password
      PMA_ROOT_PASSWORD: root_password

    ports:
      - "8082:80"

    depends_on:
      - mysql

    networks:
      - education-network

    restart: unless-stopped


# =========================
# Volumes
# =========================
volumes:
  mysql_data:


# =========================
# Networks
# =========================
networks:
  education-network:
    driver: bridge