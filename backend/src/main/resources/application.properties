# ===============================
# PROFILE CONFIGURATION
# ===============================
spring.profiles.default=${SPRING_PROFILES_DEFAULT:mysql}

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8081
server.servlet.context-path=/

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===============================
# APPLICATION INFO
# ===============================
spring.application.name=Education Backend

# ===============================
# DATASOURCE (MYSQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/education_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOL (HIKARI)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.education=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# JACKSON (JSON)
# ===============================
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ===============================
# FILE UPLOAD
# ===============================
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# DATABASE INIT
# ===============================
# Hibernate gère les tables automatiquement
# Pour MySQL tu peux ajouter schema.sql si besoin
spring.sql.init.mode=always
spring.sql.init.platform=mysql