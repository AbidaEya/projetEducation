# MySQL (XAMPP) profile
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# REQUIRES: XAMPP MySQL running on port 3306

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/educationn?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Database initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging (reduced for faster startup)
logging.level.root=INFO
logging.level.com.education=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
