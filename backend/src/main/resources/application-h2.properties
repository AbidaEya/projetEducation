# H2 (embedded) profile for quick local runs without installing MySQL
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2

# Server Configuration
server.port=8081
server.servlet.context-path=/

# Application Name
spring.application.name=Education Backend

# H2 Database Configuration - PERSISTENT FILE MODE (data is saved!)
# NOTE: Keep URL compatible with H2 2.x (avoid unsupported combinations).
spring.datasource.url=jdbc:h2:file:./data/education_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (access at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database initialization
spring.sql.init.mode=never

# Logging Configuration (reduced for faster startup)
logging.level.root=INFO
logging.level.com.education=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
